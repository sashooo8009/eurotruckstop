<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Euro Truck Stop</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #020617;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #cbd5e1;
      margin: 8px 0 0;
    }

    #map {
      height: 65vh;
      width: 100%;
    }

    .panel {
      padding: 16px;
      background: #0f172a;
    }

    .spot {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .spot h3 {
      margin: 0 0 6px;
    }

    .spot p {
      margin: 4px 0;
      color: #cbd5e1;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>🚛 Euro Truck Stop</h1>
    <p>Паркинги и места за нощувка в Европа и Скандинавия</p>
  </header>

  <div id="map"></div>

  <div class="panel" id="spotsList"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const spots = [
      {
        name: "Truck Stop Malmö",
        country: "Швеция",
        type: "TIR паркинг",
        safe: "Спокойно",
        info: "Душ, WC, гориво, храна",
        lat: 55.6050,
        lng: 13.0038
      },
      {
        name: "Padborg Truck Parking",
        country: "Дания",
        type: "Охраняем паркинг",
        safe: "Много добро място",
        info: "Охрана, душ, ресторант",
        lat: 54.8265,
        lng: 9.3620
      },
      {
        name: "Hamburg A7 Autohof",
        country: "Германия",
        type: "Autohof",
        safe: "Пълни се вечер",
        info: "Душ, WC, храна, гориво",
        lat: 53.5511,
        lng: 9.9937
      },
      {
        name: "Rotterdam Industrial Area",
        country: "Нидерландия",
        type: "Индустриална зона",
        safe: "Внимание вечер",
        info: "Място за пауза, без гаранция за охрана",
        lat: 51.9244,
        lng: 4.4777
      },
      {
        name: "Oslo E6 Rest Area",
        country: "Норвегия",
        type: "Rest area",
        safe: "Става за нощувка",
        info: "WC, тихо място, зимни условия",
        lat: 59.9139,
        lng: 10.7522
      },
      {
        name: "Lille Industrial Parking",
        country: "Франция",
        type: "Индустриално място",
        safe: "Риск от кражби",
        info: "Само ако няма друг вариант",
        lat: 50.6292,
        lng: 3.0573
      }
    ];

    const map = L.map("map").setView([54.5, 10.5], 5);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const list = document.getElementById("spotsList");

    spots.forEach((spot) => {
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;

      L.marker([spot.lat, spot.lng]).addTo(map)
        .bindPopup(`
          <b>${spot.name}</b><br>
          ${spot.country}<br>
          ${spot.type}<br>
          ${spot.safe}<br>
          <a href="${mapsUrl}" target="_blank">Навигирай</a>
        `);

      list.innerHTML += `
        <div class="spot">
          <h3>${spot.name}</h3>
          <p>📍 ${spot.country}</p>
          <p>🅿️ ${spot.type}</p>
          <p>🛡️ ${spot.safe}</p>
          <p>ℹ️ ${spot.info}</p>
          <a class="btn" href="${mapsUrl}" target="_blank">Навигирай</a>
        </div>
      `;
    });
  </script>
</body>
</html>
