<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Euro Truck Stop</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:Arial;
}

h1{
text-align:center;
padding:10px;
}

#map{
height:90vh;
width:100%;
}

.popup{
color:black;
}
</style>
</head>

<body>

<h1>🚛 Euro Truck Stop</h1>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([56, 12], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap'
}).addTo(map);

fetch('export%20(1).geojson')
.then(response => response.json())
.then(data => {

L.geoJSON(data, {

pointToLayer: function(feature, latlng) {

return L.marker(latlng);

},

onEachFeature: function(feature, layer) {

const tags = feature.properties || {};

const name = tags.name || "Truck Parking";

layer.bindPopup(`
<div class="popup">
<h3>${name}</h3>
<p>🚛 Truck Parking</p>
</div>
`);

}

}).addTo(map);

});

</script>

</body>
</html>
