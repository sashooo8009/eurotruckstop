<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Euro Truck Stop</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
}

header{
padding:20px;
text-align:center;
background:#020617;
}

header h1{
margin:0;
font-size:42px;
}

header p{
color:#cbd5e1;
margin-top:10px;
font-size:18px;
}

.topbar{
padding:12px;
display:flex;
gap:10px;
background:#0f172a;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:bold;
font-size:16px;
}

#map{
height:55vh;
width:100%;
}

.panel{
padding:16px;
}

.card{
background:#111827;
border:1px solid #334155;
border-radius:20px;
padding:16px;
margin-bottom:16px;
}

.card h3{
margin-top:0;
font-size:24px;
}

.safe{
color:#22c55e;
font-weight:bold;
}

.danger{
color:#ef4444;
font-weight:bold;
}

.btn{
display:inline-block;
margin-top:10px;
padding:12px 16px;
background:#2563eb;
border-radius:12px;
color:white;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🚛 Euro Truck Stop</h1>
<p>Safe truck parking across Europe</p>
</header>

<div class="topbar">
<input type="text" id="search" placeholder="Търси държава или паркинг">
<button onclick="findMe()">📍 Аз</button>
</div>

<div id="map"></div>

<div class="panel" id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([55,10],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

const spots = [

{
name:"Malmö Truck Stop",
country:"Sweden",
safe:true,
text:"Safe parking with showers and food",
lat:55.605,
lng:13.0038
},

{
name:"Padborg Parking",
country:"Denmark",
safe:true,
text:"Secure truck parking",
lat:54.826,
lng:9.362
},

{
name:"Hamburg A7",
country:"Germany",
safe:true,
text:"Large truck stop and fuel",
lat:53.551,
lng:9.993
},

{
name:"Rotterdam Industrial",
country:"Netherlands",
safe:false,
text:"Industrial overnight area",
lat:51.924,
lng:4.477
},

{
name:"Lille Industrial",
country:"France",
safe:false,
text:"Risk of theft at night",
lat:50.629,
lng:3.057
}

];

const list=document.getElementById("list");

spots.forEach(spot=>{

const color = spot.safe ? "green" : "red";

const icon = L.icon({
iconUrl:`https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
shadowUrl:'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
iconSize:[25,41],
iconAnchor:[12,41]
});

const maps=`https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;

L.marker([spot.lat,spot.lng],{icon}).addTo(map)
.bindPopup(`
<b>${spot.name}</b><br>
${spot.country}<br>
${spot.text}<br><br>
<a href="${maps}" target="_blank">Навигирай</a>
`);

list.innerHTML += `
<div class="card">
<h3>${spot.name}</h3>

<p>📍 ${spot.country}</p>

<p class="${spot.safe ? 'safe':'danger'}">
${spot.safe ? '🟢 SAFE':'🔴 DANGEROUS'}
</p>

<p>${spot.text}</p>

<a class="btn" href="${maps}" target="_blank">
🗺️ Google Maps
</a>

</div>
`;

});

function findMe(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(position=>{

const lat=position.coords.latitude;
const lng=position.coords.longitude;

map.setView([lat,lng],10);

L.marker([lat,lng]).addTo(map)
.bindPopup("📍 Ти си тук")
.openPopup();

});

}

}

document.getElementById("search").addEventListener("input",function(){

const value=this.value.toLowerCase();

const cards=document.querySelectorAll(".card");

cards.forEach(card=>{

if(card.innerText.toLowerCase().includes(value)){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>

</body>
</html>
