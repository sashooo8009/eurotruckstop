<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Euro Truck Stop</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#020b2d;
color:white;
}

header{
padding:20px;
text-align:center;
}

h1{
font-size:42px;
margin:0;
}

p{
font-size:20px;
opacity:0.9;
}

#map{
height:70vh;
width:100%;
border-top:2px solid #1e90ff;
}

.card{
background:#08153f;
margin:15px;
padding:15px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.1);
}

.card h2{
margin:0 0 10px;
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:10px;
background:#1e90ff;
margin-top:8px;
}
</style>
</head>

<body>

<header>
<h1>🚛 Euro Truck Stop</h1>
<p>Паркинги и места за нощувка в Европа</p>
</header>

<div id="map"></div>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const SUPABASE_URL = "https://cwrcaweybftuphjgrtba.supabase.co";
const SUPABASE_KEY = "sb_publishable_F9Mz5V-ejFuuQ24whlFY_w_jSJ8jV4J";

const map = L.map('map').setView([54.5, 15], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

async function loadParkings(){

const response = await fetch(
`${SUPABASE_URL}/rest/v1/parkings`,
{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
}
);

const data = await response.json();

const list = document.getElementById("list");

data.forEach(parking=>{

if(parking.lat && parking.lng){

L.marker([parking.lat, parking.lng])
.addTo(map)
.bindPopup(`
<b>${parking.name}</b><br>
${parking.country || ""}
`);

}

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<h2>${parking.name || "Truck Parking"}</h2>
<div>📍 ${parking.country || ""}</div>
<div class="badge">${parking.type || "Parking"}</div>
`;

list.appendChild(card);

});

}

loadParkings();
</script>

</body>
</html>
